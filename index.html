<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>視障語文自主學習系統 - 識字教學遊戲</title>
    <style>
        /* 核心高對比度變數設定（預設：米白底黑字） */
        :root {
            --bg-color: #FDF5E6; --text-color: #000000; --box-border: #000000; 
            --panel-bg: #EAE0C8; --panel-text: #000000;
            --active-bg: #000000; --active-border: #000000; --active-text: #FDF5E6; 
            --font-size: 53px; --box-size: 1.4em;
            --home-btn-size: 32px; --home-subtext-size: 20px;
        }
        /* 主題切換方案 */
        body.theme-white-black { --bg-color: #ffffff; --text-color: #000000; --box-border: #000000; --panel-bg: #e0e0e0; --panel-text: #000000; --active-bg: #000000; --active-border: #ff0000; --active-text: #ffffff; }
        body.theme-black-white { --bg-color: #000000; --text-color: #ffffff; --box-border: #ffffff; --panel-bg: #222222; --panel-text: #ffffff; --active-bg: #ffffff; --active-border: #ff0000; --active-text: #000000; }
        body.theme-black-yellow { --bg-color: #000000; --text-color: #ffff00; --box-border: #ffff00; --panel-bg: #222222; --panel-text: #ffff00; --active-bg: #ffff00; --active-border: #ff0000; --active-text: #000000; }

        /* 防禦性滿版佈局 (完整支援 iPad 及 Windows 螢幕，免頁面捲動) */
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: "Kaiti TC", "STKaiti", "DFKai-SB", "BiauKai", "KaiTi", "楷體", serif;
            margin: 0; padding: 5px 10px 35px 10px; transition: background-color 0.2s, color 0.2s;
            height: 100vh; box-sizing: border-box; display: flex; flex-direction: column;
            align-items: center; overflow: hidden;
        }

        /* Splash 載入畫面 (顯示 1.5 秒自動跳轉) */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; z-index: 9999; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; transition: opacity 0.5s ease-out; opacity: 1;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }
        .splash-title { font-size: 45px; margin-top: 20px; color: #000000; letter-spacing: 5px; font-weight: bold; }

        /* 頂部極簡控制列 */
        .top-bar {
            width: 100%; max-width: 1280px; display: flex; flex-wrap: wrap; 
            justify-content: flex-end; align-items: center; gap: 10px;
            margin-bottom: 5px; padding-bottom: 5px; border-bottom: 3px solid var(--text-color); flex-shrink: 0;
        }
        .sch-logo { height: 50px; background: transparent; border: none; margin-right: auto; object-fit: contain; }
        .icon-btn {
            font-size: 28px; width: 55px; height: 55px; background-color: var(--panel-bg);
            color: var(--panel-text); border: 3px solid var(--text-color); border-radius: 12px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            font-weight: bold; transition: all 0.2s; padding: 0;
        }
        .icon-btn:hover, .icon-btn:focus { background-color: var(--text-color); color: var(--bg-color); transform: scale(1.05); }

        /* 左下角 HUD 與 右下角 Footer */
        .zoom-display-fixed {
            position: fixed; bottom: 5px; left: 15px; font-size: 15px; font-weight: bold;
            color: var(--text-color); background-color: var(--panel-bg); padding: 4px 10px;
            border-radius: 6px; border: 2px solid var(--box-border); user-select: none; z-index: 100;
        }
        .footer { position: fixed; bottom: 5px; right: 15px; font-size: 14px; color: var(--text-color); opacity: 0.85; font-weight: bold; z-index: 100; }

        /* 設定面板彈窗 */
        .modal-panel {
            display: none; position: fixed; top: 5%; left: 5%; width: 90%; max-width: 800px;
            height: 90vh; background-color: var(--panel-bg); color: var(--panel-text);
            border: 5px solid var(--text-color); border-radius: 15px; padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); z-index: 2000; overflow-y: auto; box-sizing: border-box;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--text-color); padding-bottom: 15px; margin-bottom: 20px; }
        .panel-header button { width: auto; min-width: 120px; font-size: 20px; padding: 10px 20px; border-radius: 8px; border: 2px solid var(--text-color); background-color: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: bold; }
        .settings-item { margin-bottom: 30px; }
        .settings-item label { display: block; margin-bottom: 12px; font-weight: bold; font-size: 24px; }
        .settings-item button {
            padding: 12px 18px; margin: 5px; font-size: 20px; background-color: var(--bg-color);
            color: var(--text-color); border: 2px solid var(--text-color); border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
        }
        .settings-item button.active-setting { background-color: var(--text-color) !important; color: var(--bg-color) !important; font-weight: bold; }

        /* 內容容器：最大化空間 */
        #home-container, #article-container { width: 100%; max-width: 1280px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; box-sizing: border-box; }
        #home-container { align-items: center; padding: 10px; }
        #article-container { padding: 5px; user-select: none; -webkit-user-select: none; display: none; }

        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1050px; padding-bottom: 20px; }
        .lesson-btn {
            background-color: var(--panel-bg); color: var(--panel-text); border: 4px solid var(--box-border);
            border-radius: 15px; padding: 18px 12px; font-size: var(--home-btn-size); font-weight: bold; cursor: pointer;
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit;
        }
        .lesson-btn:focus { background-color: var(--text-color); color: var(--bg-color); outline: none; }
        .lesson-btn .btn-subtext { font-size: var(--home-subtext-size); opacity: 0.85; font-weight: normal; }
        .lesson-btn.completed { border-color: #28a745; background-color: rgba(40, 167, 69, 0.15); }

        /* 文章標題與段落導航列 */
        .article-title-display { font-size: calc(var(--font-size) * 0.7); font-weight: bold; margin-bottom: 8px; text-align: center; color: var(--text-color); }
        .para-nav-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; padding: 8px 12px; background-color: var(--panel-bg); border-radius: 10px; border: 2px solid var(--box-border); flex-shrink: 0; }
        .para-nav-text { font-size: 22px; font-weight: bold; margin-right: 10px; }
        .para-dot-btn { 
            font-size: 22px; font-weight: bold; padding: 6px 14px; border-radius: 10px;
            border: 3px solid var(--text-color); background-color: var(--bg-color); color: var(--text-color);
            cursor: pointer; transition: transform 0.1s; font-family: inherit; display: flex; align-items: center; gap: 5px;
        }
        .para-dot-btn.active { background-color: var(--text-color); color: var(--bg-color); transform: scale(1.08); border-color: #ff0000; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }

        /* 加長文字框區域 */
        .paragraph { 
            display: flex; flex-wrap: wrap; justify-content: flex-start; align-content: flex-start;
            padding: 15px; border: 3px dashed var(--box-border); border-radius: 12px; 
            width: 100%; height: 100%; min-height: 250px; box-sizing: border-box; flex-grow: 1; overflow-y: auto; 
        }
        .line-container { display: flex; flex-wrap: wrap; width: 100%; margin-bottom: 8px; }
        .word { display: inline-flex; align-items: center; justify-content: center; width: var(--box-size); height: var(--box-size); border: 3px solid var(--box-border); border-radius: 0.15em; margin: 5px; font-size: var(--font-size); color: var(--text-color); cursor: pointer; box-sizing: border-box; }
        .word:focus, .word.active { background-color: var(--active-bg); border-color: var(--active-border); color: var(--active-text); transform: scale(1.05); }

        /* 動作區與按鈕 */
        .action-zone { width: 100%; max-width: 1280px; display: none; flex-direction: column; align-items: center; margin-top: 5px; flex-shrink: 0; gap: 5px; }
        .btn-large { font-size: 26px; font-weight: bold; padding: 10px 30px; border-radius: 50px; width: 100%; max-width: 600px; cursor: pointer; border: 3px solid var(--text-color); font-family: inherit; transition: background-color 0.2s; }
        
        /* 「我讀完這一段了」與「我讀完了」統一高對比深藍 #141d8a 與白字 #ffffff */
        .btn-finish-para, .btn-finish-art { background-color: #141d8a !important; color: #ffffff !important; }
        .btn-next-para { background-color: #ffc107; color: #000000; }
        .btn-back-home { background-color: #6f42c1; color: #ffffff; } 
        .praise-animate { font-size: 26px; font-weight: bold; color: #ff3399; min-height: 30px; text-align: center; }
        
        /* 教師後台編輯區 */
        .teacher-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 18px; }
        .teacher-table th, .teacher-table td { border: 2px solid var(--text-color); padding: 10px; text-align: left; }
        .teacher-editor-card { background-color: var(--bg-color); border: 2px solid var(--text-color); border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .teacher-editor-card label { font-size: 18px; font-weight: bold; display: block; margin-bottom: 5px; }
        .input-title { width: 100%; font-size: 18px; font-weight: bold; padding: 6px; margin-bottom: 8px; box-sizing: border-box; font-family: inherit; }
        .textarea-article { width: 100%; height: 90px; font-size: 16px; margin-bottom: 5px; box-sizing: border-box; font-family: inherit; padding: 6px; }
    </style>
</head>
<body class="theme-default">

    <!-- Splash 載入畫面 (顯示 1.5 秒自動淡出跳轉首頁) -->
    <div id="splash-screen" aria-hidden="true">
        <img src="https://drive.google.com/thumbnail?id=1l2gx_ICVZthVkMFYASuI1brX1vSjw5pF&sz=w1000" alt="心光學校 Logo">
        <h1 class="splash-title">心光學校 低視組</h1>
    </div>

    <!-- 頂部極簡控制列 -->
    <div class="top-bar" role="navigation" aria-label="主選單">
        <img src="https://drive.google.com/thumbnail?id=1CjE8UZPcBzx2Q_p6hDkNDaRQ8W37ex8i&sz=w400" alt="School Logo" class="sch-logo">
        <button class="icon-btn" onclick="goHome()" aria-label="返回首頁" title="首頁">🏠</button>
        <button class="icon-btn" onclick="cycleTheme()" aria-label="切換主題色彩" title="切換主題色彩">🌓</button>
        <button class="icon-btn" onclick="adjustFontSize(-5)" aria-label="縮小文字" title="縮小字體">A-</button>
        <button class="icon-btn" onclick="adjustFontSize(5)" aria-label="放大文字" title="放大字體">A+</button>
        <button class="icon-btn" onclick="openPanel('student-panel')" aria-label="語音與獎勵設定" title="設定">⚙️</button>
        <button class="icon-btn" onclick="openPanel('teacher-panel')" aria-label="教師管理後台" title="後台">👨‍🏫</button>
    </div>

    <!-- 學生設定彈窗 (加入 1.3x 較快語速) -->
    <div id="student-panel" class="modal-panel" role="dialog" aria-label="語音與回饋設定">
        <div class="panel-header"><h2>⚙️ 語音與回饋設定</h2><button onclick="closePanel('student-panel')">關閉</button></div>
        <div class="settings-item" id="setting-group-lang"><label>🗣️ 朗讀語言</label><button data-val="zh-HK" onclick="setLanguage('zh-HK')">粵語</button><button data-val="zh-CN" onclick="setLanguage('zh-CN')">普通話</button></div>
        <div class="settings-item" id="setting-group-speed">
            <label>🗣️ 朗讀語速</label>
            <button data-val="0.5" onclick="setSpeed(0.5)">極慢</button>
            <button data-val="0.75" onclick="setSpeed(0.75)">較慢</button>
            <button data-val="1.0" onclick="setSpeed(1.0)">正常</button>
            <button data-val="1.3" onclick="setSpeed(1.3)">較快</button>
        </div>
        <div class="settings-item" id="setting-group-reward">
            <label>🔊 獎勵音效</label>
            <button data-val="cantonese" onclick="setReward('cantonese')">粵語讚賞</button>
            <button data-val="english" onclick="setReward('english')">英文讚賞</button>
            <button data-val="coin" onclick="setReward('coin')">🪙金幣聲</button>
            <button data-val="mtr" onclick="setReward('mtr')">🚇地鐵聲</button>
        </div>
    </div>

    <!-- 教師後台彈窗 -->
    <div id="teacher-panel" class="modal-panel" role="dialog" aria-label="教師管理後台">
        <div class="panel-header"><h2>👨‍🏫 教師管理後台</h2><button onclick="closePanel('teacher-panel')">關閉</button></div>
        <div class="settings-item">
            <h3>📈 學生功課完成度</h3>
            <button onclick="clearProgressAndCache()" style="background-color: #ff3333; color: white; padding: 10px; border-radius: 5px;">重設進度與恢復預設課文</button>
            <table class="teacher-table"><thead><tr><th>課文標題</th><th>狀態</th><th>獎勵</th></tr></thead><tbody id="progress-table-body"></tbody></table>
        </div>
        <div class="settings-item">
            <h3>📝 編輯課文與標題 (Enter換行，連續兩個Enter分段)</h3>
            <button onclick="saveArticlesToStorage()" style="background-color: #28a745; color: white; padding: 10px; margin-bottom:15px;">💾 儲存變更</button>
            <div id="teacher-articles-edit-zone"></div>
        </div>
    </div>

    <div id="home-container" role="main" aria-label="請選擇課文"></div>
    <div id="article-container" role="main" aria-label="閱讀內容區"></div>

    <div class="action-zone" id="action-zone-container">
        <button id="dynamic-action-btn" class="btn-large" onclick="handleMainAction()"></button>
        <div id="praise-output" class="praise-animate" aria-live="assertive"></div>
    </div>

    <!-- 左下角 HUD 文字大小動態指示器 -->
    <div id="zoom-indicator" class="zoom-display-fixed" aria-hidden="true">文字大小 100%, 40pt, 53px</div>
    
    <!-- 右下角版權宣告 Footer -->
    <div class="footer" aria-hidden="true">©2026 ES LVTeam. All rights reserved.</div>

<script>
    const defaultArticles = [
        { title: "詠鵝", content: "鵝鵝鵝，曲項向天歌。\n白毛浮綠水，紅掌撥清波。" },
        { title: "春曉", content: "春眠不覺曉，處處聞啼鳥。\n夜來風雨聲，花落知多少。" },
        { title: "論語四則", content: "子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」\n\n曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」\n\n子曰：「溫故而知新，可以為師矣。」\n\n子曰：「學而不思則罔，思而不學則殆。」" },
        { title: "靜夜思", content: "床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。" },
        { title: "黃鶴樓", content: "昔人已乘黃鶴去，此地空餘黃鶴樓。\n黃鶴一去不複返，白雲千載空悠悠。\n晴川歷歷漢陽樹，芳草萋萋鸚鵡洲。\n日暮鄉關何處是？煙波江上使人愁。" },
        { title: "早發白帝城", content: "朝辭白帝彩雲間，千里江陵一日還。\n兩岸猿聲啼不住，輕舟已過萬重山。" },
        { title: "春望", content: "國破山河在，城春草木深。\n感時花濺淚，恨別鳥驚心。\n烽火連三月，家書抵萬金。\n白頭搔更短，渾欲不勝簪。" },
        { title: "遊子吟", content: "慈母手中線，遊子身上衣。\n臨行密密縫，意恐遲遲歸。\n誰言寸草心，報得三春暉。" }
    ];

    let globalArticles = [];
    let currentArticleIndex = 0;
    let currentParagraphs = [];
    let currentParagraphIndex = 0;
    let currentSpeed = 1.0, currentRewardType = 'cantonese', currentReadingLang = 'zh-HK'; 
    let studentProgress = {}; 
    const themes = ['', 'theme-white-black', 'theme-black-white', 'theme-black-yellow'];
    let themeIndex = 0;
    const synth = window.speechSynthesis;
    let audioCtx = null; 
    let isReadingMode = false, lastTouchedElement = null, currentFontSizePt = 40;

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 500); }
        }, 1500);

        try {
            const localArts = localStorage.getItem('vi_articles_v5');
            if (localArts) {
                globalArticles = JSON.parse(localArts);
            } else {
                globalArticles = JSON.parse(JSON.stringify(defaultArticles));
                while(globalArticles.length < 10) globalArticles.push({ title: "", content: "" });
            }
            
            const localProg = localStorage.getItem('vi_progress_v5'); 
            studentProgress = localProg ? JSON.parse(localProg) : {};
        } catch(e) {
            globalArticles = JSON.parse(JSON.stringify(defaultArticles));
            while(globalArticles.length < 10) globalArticles.push({ title: "", content: "" });
            studentProgress = {};
        }

        buildTeacherEditor();
        buildHomeLessons();
        showView('home');
        renderTeacherProgressTable();
        setupTouchEvents();
        updateFontSize(40); 
        updateSettingVisuals(); 
    });

    function goHome() { buildHomeLessons(); showView('home'); }
    function cycleTheme() { themeIndex = (themeIndex + 1) % themes.length; document.body.className = themes[themeIndex]; }
    
    function clearProgressAndCache() { 
        if(confirm("確定重設進度並恢復預設課文？")) { 
            studentProgress = {}; 
            localStorage.removeItem('vi_progress_v5');
            localStorage.removeItem('vi_articles_v5');
            globalArticles = JSON.parse(JSON.stringify(defaultArticles));
            while(globalArticles.length < 10) globalArticles.push({ title: "", content: "" });
            buildTeacherEditor();
            buildHomeLessons();
            renderTeacherProgressTable(); 
            alert("已成功重設！");
        } 
    }

    function buildHomeLessons() {
        const hc = document.getElementById('home-container'); hc.innerHTML = '';
        const grid = document.createElement('div'); grid.className = 'lesson-grid';
        globalArticles.forEach((art, idx) => {
            if(!art || (!art.title && !art.content)) return;
            const btn = document.createElement('button'); btn.className = 'lesson-btn';
            
            const isCompleted = studentProgress[idx] && studentProgress[idx].completed;
            const displayTitle = `${idx + 1}. ${art.title || '無標題'}`;
            const previewText = art.content.substring(0, 12).replace(/\n/g, ' ');
            
            if(isCompleted) {
                btn.classList.add('completed');
                btn.innerHTML = `<div>${displayTitle} ✅</div><div class="btn-subtext">${previewText}...</div>`;
            } else {
                btn.innerHTML = `<div>${displayTitle}</div><div class="btn-subtext">${previewText}...</div>`;
            }
            
            btn.onclick = () => loadArticleByIndex(idx);
            grid.appendChild(btn);
        });
        hc.appendChild(grid);
    }

    function showView(view) {
        document.getElementById('home-container').style.display = view === 'home' ? 'flex' : 'none';
        document.getElementById('article-container').style.display = view === 'lesson' ? 'flex' : 'none';
        document.getElementById('action-zone-container').style.display = view === 'lesson' ? 'flex' : 'none';
    }

    function loadArticleByIndex(idx) {
        currentArticleIndex = idx;
        const art = globalArticles[idx] || { title: "", content: "" };
        currentParagraphs = art.content.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
        if (currentParagraphs.length === 0) currentParagraphs = [""]; 
        
        if (!studentProgress[idx] || typeof studentProgress[idx].completed === 'undefined') {
            studentProgress[idx] = { completed: false, paras: new Array(currentParagraphs.length).fill(false) };
        } else if (studentProgress[idx].paras.length !== currentParagraphs.length) {
            studentProgress[idx].paras = new Array(currentParagraphs.length).fill(false);
        }

        currentParagraphIndex = 0;
        document.getElementById('praise-output').innerText = ''; 
        renderCurrentParagraph();
        showView('lesson');
    }

    function renderCurrentParagraph() {
        const container = document.getElementById('article-container'); container.innerHTML = '';

        const art = globalArticles[currentArticleIndex];
        const titleHeader = document.createElement('div');
        titleHeader.className = 'article-title-display';
        titleHeader.innerText = `${currentArticleIndex + 1}. ${art.title || ''}`;
        container.appendChild(titleHeader);

        if (currentParagraphs.length > 1) {
            const nav = document.createElement('div'); nav.className = 'para-nav-bar';
            nav.innerHTML = `<span class="para-nav-text" aria-live="polite">段落選擇：</span>`;
            currentParagraphs.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'para-dot-btn';
                const isDone = studentProgress[currentArticleIndex].paras[i];
                btn.innerText = `${i + 1} ${isDone ? '🟢' : '⚪'}`;
                if(i === currentParagraphIndex) btn.classList.add('active');
                btn.onclick = () => { currentParagraphIndex = i; renderCurrentParagraph(); };
                nav.appendChild(btn);
            });
            container.appendChild(nav);
        }

        const pDiv = document.createElement('div'); pDiv.className = 'paragraph';
        const txt = currentParagraphs[currentParagraphIndex] || "";
        
        const lines = txt.split('\n');
        lines.forEach(line => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'line-container';
            for (let char of line.trim()) {
                const span = document.createElement('span'); span.textContent = char;
                if (char.trim() !== '') {
                    span.className = 'word'; span.tabIndex = 0;
                    span.onmouseenter = span.onfocus = () => { document.querySelectorAll('.word').forEach(w=>w.classList.remove('active')); span.classList.add('active'); speakText(char); };
                } else span.style.width = "20px";
                lineDiv.appendChild(span);
            }
            pDiv.appendChild(lineDiv);
        });
        container.appendChild(pDiv);

        checkCompletionStatus();
    }

    function checkCompletionStatus() {
        const total = currentParagraphs.length;
        const currentDone = studentProgress[currentArticleIndex].paras[currentParagraphIndex];
        const allDone = studentProgress[currentArticleIndex].paras.every(p => p === true);
        const isArticleCompleted = studentProgress[currentArticleIndex].completed;

        const btn = document.getElementById('dynamic-action-btn');
        btn.style.display = 'block';

        if (total === 1) {
            if (!isArticleCompleted) {
                btn.innerText = "我讀完了";
                btn.className = "btn-large btn-finish-art";
            } else {
                btn.innerText = "回到首頁";
                btn.className = "btn-large btn-back-home";
            }
        } else {
            if (!currentDone) {
                btn.innerText = "我讀完這一段了";
                btn.className = "btn-large btn-finish-para";
            } else if (!allDone) {
                btn.innerText = "下一段";
                btn.className = "btn-large btn-next-para";
            } else {
                btn.innerText = isArticleCompleted ? "回到首頁" : "🌟 我讀完了，回到首頁 🌟";
                btn.className = "btn-large btn-finish-art";
            }
        }
    }

    function handleMainAction() {
        const total = currentParagraphs.length;
        const currentDone = studentProgress[currentArticleIndex].paras[currentParagraphIndex];
        const allDone = studentProgress[currentArticleIndex].paras.every(p => p === true);
        const isArticleCompleted = studentProgress[currentArticleIndex].completed;

        if (total === 1) {
            if (!isArticleCompleted) {
                studentProgress[currentArticleIndex].paras[0] = true;
                studentProgress[currentArticleIndex].completed = true;
                localStorage.setItem('vi_progress_v5', JSON.stringify(studentProgress));
                playAudioReward();
                document.getElementById('praise-output').innerText = "🎉 恭喜讀完！";
                renderCurrentParagraph(); 
            } else {
                goHome();
            }
        } else {
            if (!currentDone) {
                studentProgress[currentArticleIndex].paras[currentParagraphIndex] = true;
                localStorage.setItem('vi_progress_v5', JSON.stringify(studentProgress));
                if(synth) speakText("本段完成");
                renderCurrentParagraph(); 
            } else if (!allDone) {
                if (currentParagraphIndex < total - 1) {
                    currentParagraphIndex++;
                } else {
                    const firstUnread = studentProgress[currentArticleIndex].paras.findIndex(p => p === false);
                    if(firstUnread !== -1) currentParagraphIndex = firstUnread;
                }
                renderCurrentParagraph();
            } else {
                if (!isArticleCompleted) {
                    studentProgress[currentArticleIndex].completed = true;
                    localStorage.setItem('vi_progress_v5', JSON.stringify(studentProgress));
                    playAudioReward();
                    document.getElementById('praise-output').innerText = "🎉 恭喜讀完！即將回到首頁...";
                    renderCurrentParagraph();
                    setTimeout(() => goHome(), 1800); 
                } else {
                    goHome();
                }
            }
        }
    }

    function updateSettingVisuals() {
        document.querySelectorAll('#setting-group-lang button').forEach(b => b.classList.toggle('active-setting', b.dataset.val === currentReadingLang));
        document.querySelectorAll('#setting-group-speed button').forEach(b => b.classList.toggle('active-setting', parseFloat(b.dataset.val) === currentSpeed));
        document.querySelectorAll('#setting-group-reward button').forEach(b => b.classList.toggle('active-setting', b.dataset.val === currentRewardType));
    }
    function setLanguage(l) { currentReadingLang = l; updateSettingVisuals(); speakText(l === 'zh-HK' ? '粵語' : '普通話'); }
    function setSpeed(s) { currentSpeed = s; updateSettingVisuals(); }
    function setReward(r) { currentRewardType = r; updateSettingVisuals(); playAudioReward(); }
    
    function speakText(t, langOverride = null) { 
        if(!synth) return; 
        synth.cancel(); 
        const u = new SpeechSynthesisUtterance(t); 
        u.lang = langOverride ? langOverride : (/[a-zA-Z]/.test(t) ? 'en-US' : currentReadingLang); 
        u.rate = currentSpeed; 
        synth.speak(u); 
    }
    
    function setupTouchEvents() {
        const c = document.getElementById('article-container');
        c.addEventListener('touchstart', e => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(e.touches.length > 1) return; const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            if(el && el.classList.contains('word')) { isReadingMode = true; el.focus(); }
        }, { passive: false });
        c.addEventListener('touchmove', e => {
            if(e.touches.length > 1 || !isReadingMode) return; e.preventDefault();
            const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            if(el && el.classList.contains('word') && el !== lastTouchedElement) { lastTouchedElement = el; el.focus(); }
        }, { passive: false });
        c.addEventListener('touchend', () => isReadingMode = false);
    }

    function updateFontSize(pt) {
        currentFontSizePt = Math.max(20, Math.min(pt, 160));
        const px = Math.round(currentFontSizePt * 1.33);
        const percent = Math.round((currentFontSizePt / 40) * 100);
        const scaleRatio = currentFontSizePt / 40;
        
        document.documentElement.style.setProperty('--font-size', px + 'px');
        document.documentElement.style.setProperty('--home-btn-size', Math.round(32 * scaleRatio) + 'px');
        document.documentElement.style.setProperty('--home-subtext-size', Math.round(20 * scaleRatio) + 'px');
        
        document.getElementById('zoom-indicator').innerText = `文字大小 ${percent}%, ${currentFontSizePt}pt, ${px}px`;
    }
    function adjustFontSize(offset) { updateFontSize(currentFontSizePt + offset); }

    function playAudioReward() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(currentRewardType === 'coin') {
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if(currentRewardType === 'mtr') {
            for(let i=0; i<4; i++){ let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(1150, audioCtx.currentTime + i*0.25); gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i*0.25); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.25 + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(audioCtx.currentTime + i*0.25); osc.stop(audioCtx.currentTime + i*0.25 + 0.2); }
        } else if(currentRewardType === 'english') {
            speakText("Great job! Excellent work!", 'en-US');
        } else { 
            speakText("你好叻呀", 'zh-HK'); 
        }
    }

    window.openPanel = id => { document.getElementById(id).style.display = 'block'; if(id==='teacher-panel') renderTeacherProgressTable(); };
    window.closePanel = id => document.getElementById(id).style.display = 'none';

    function renderTeacherProgressTable() {
        const tb = document.getElementById('progress-table-body'); tb.innerHTML = '';
        globalArticles.forEach((art, idx) => {
            if(!art || (!art.title && !art.content)) return; const tr = document.createElement('tr');
            const isDone = studentProgress[idx] && studentProgress[idx].completed;
            tr.innerHTML = `<td>${idx+1}. ${art.title || '無標題'}</td><td>${isDone ? '✅' : '❌'}</td><td>${isDone ? '🌟' : '-'}</td>`;
            tb.appendChild(tr);
        });
    }

    function buildTeacherEditor() {
        const zone = document.getElementById('teacher-articles-edit-zone'); zone.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const art = globalArticles[i] || { title: "", content: "" };
            const card = document.createElement('div');
            card.className = 'teacher-editor-card';
            card.innerHTML = `
                <label>編號 ${i + 1}</label>
                <input type="text" id="edit-title-${i}" class="input-title" placeholder="課文標題 (例如: 靜夜思)" value="${art.title || ''}">
                <textarea id="edit-content-${i}" class="textarea-article" placeholder="課文內文 (換行即換列，雙換行即分段)...">${art.content || ''}</textarea>
            `;
            zone.appendChild(card);
        }
    }

    function saveArticlesToStorage() {
        for (let i = 0; i < 10; i++) {
            const titleVal = document.getElementById(`edit-title-${i}`).value.trim();
            const contentVal = document.getElementById(`edit-content-${i}`).value;
            globalArticles[i] = { title: titleVal, content: contentVal };
        }
        localStorage.setItem('vi_articles_v5', JSON.stringify(globalArticles));
        buildHomeLessons(); 
        alert("💾 課文標題與內文已成功更新！");
    }
</script>
</body>
